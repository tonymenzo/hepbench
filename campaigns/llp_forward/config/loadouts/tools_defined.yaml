# Pipeline-only LLP toolset: heptapod's `forward-llp-defined` loadout (the llp
# pipeline + PythiaFromRunCard, NO symbolic-amplitude tools) served via
# toolbase. Pair with the `defined` variant, where the decay widths are
# supplied so no derivation is needed. The `derived` variant (widths withheld)
# instead pairs with `tools_derived`, which adds the eda symbolic tools for the
# width derivation. Reached over MCP by claude-code or in process by orchestral.
name: tools_defined
tools:
  sources:
    - toolbase: { loadout: forward-llp-defined }

# THE THIRD LEG, alongside tools and skills: the framing a real domain harness
# ships so its users know the toolset exists and is the intended path. Without
# it this arm measured a bundle nobody would actually deploy -- and the
# 2026-08-10 campaigns showed why that matters: gpt-5.6 had six tools served
# and visible, the guide injected in full, and called nothing across five
# trials, while gpt-5.5 did the same across three in 2026-08-06. An arm that
# never reaches for its tools is not testing them.
#
# Deliberately MODEST. It states that the toolkit exists, that it is preferred
# over reimplementation, and that the descriptions are worth reading. It does
# NOT claim the tools are more accurate, name a tool, hint at an order, or say
# anything about the physics -- any of which would leak method rather than
# frame the harness. It lives on the LOADOUT, so a no-tools arm can never
# receive prose describing tools it does not have.
#
# It is part of the measured treatment and is recorded verbatim in each trial
# record, so a campaign run with it is distinguishable from one run without.
system_prompt_addendum: |
  This workspace is equipped with a domain toolkit, served over MCP alongside
  your built-in tools. Prefer it to writing your own implementation of the
  same step: read the available tool descriptions before deciding how to carry
  out a stage, and use a tool where one covers what you need. Where no tool
  fits, implement the step yourself as usual.
# THE THIRD LEG OF THE DOMAIN HARNESS. The bundle is what is under test, not
# just its callable tools, so the practice needed to drive Pythia for a forward
# study travels with this arm. `bare` withholds the generator recipe from the
# prompt deliberately (see that variant's WHAT IS WITHHELD): a dedicated onia
# sample undercounts the forward quarkonium flux by ~1.32x, and knowing that is
# domain practice rather than something the task statement should hand over.
#
# WHY A COPY RATHER THAN THE TOOLKIT'S OWN. heptapod ships this same guide at
# skills/pythia_forward_run_cards/SKILL.md, scoped to the `llp` bundle, and that
# is its canonical home -- a real user who installs heptapod gets it. It does
# not reach a graded trial, because there is no bridge: nothing in toolbench
# imports toolbase.skills, and the toolbase source backend resolves tools from a
# toolbase loadout while ignoring that loadout's guides. A loadout's own
# `skills:` list is the only path in, and it takes a file, so the benchmark
# holds a copy and tests/test_skill_parity.py asserts it has not drifted.
#
# AND `tb connect` MUST NOT BE USED BEFORE A GRADED RUN. It surfaces toolkit
# guides into ~/.claude/skills/, which is GLOBAL. A trial really does drive the
# `claude` CLI under subscription auth (core/runtime.py: "the `claude` CLI is
# not on PATH ... log in (subscription auth)"), and the invocation passes no
# --setting-sources, so the CLI loads its default sources including the user
# level. Verified empirically: a headless `claude -p` from a neutral directory
# lists the tb-surfaced aster__* and feynrules-madgraph guides. A skill surfaced
# that way would reach core_only too and silently destroy the ablation.
#
# DELIVERY IS NATIVE, as of toolbench 0.7.0. `on_demand` no longer means a file
# plus a filename pointer the agent has to gamble on: the runner writes the
# guide to <sandbox>/.claude/skills/<name>/SKILL.md, which the CLI discovers as
# a real project skill, so the model is shown this entry's `description` and can
# invoke it without opening anything. Confirmed against the live CLI with the
# file tools disallowed -- the model still paraphrased the description.
#
# That release also closed the two leaks that made the arms non-comparable:
# --setting-sources project (so ~/.claude/skills, i.e. anything `tb connect`
# left behind or the operator wrote, is out of scope) and a .git marker in the
# sandbox (so the enclosing hepbench repo's own .claude/skills/ is no longer
# inherited). Measured in a real sandbox, core_only now lists no skills beyond
# the CLI's built-ins and this arm lists exactly one more: this guide.
#
# toolbench still copies ONE file per entry, which is why the guide inlines its
# run cards rather than pointing at the cards/ directory beside it in heptapod.
# `mode: inline` remains the lever if delivery must be guaranteed rather than
# merely advertised.
skills:
  - name: pythia_forward_run_cards
    file: ./skills/pythia_forward_run_cards.md
    mode: on_demand
