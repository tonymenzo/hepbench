- id: codex_gpt5.6__bare__tools_defined
  system: Codex GPT-5.6
  arm: tools
  model: gpt-5.6-sol
  variant: bare
  loadout: tools_defined
  search: 2026-08-10T21-16-39_llp_forward-reach_gpt-5.6-sol_run
  prefix: tools_defined__
  stack: >-
    heptapod 3.0.0 (venv); toolbench 0.7.0 / toolbase 0.14.0 / orchestral
    1.10.0; codex-cli 0.146.0. WITH the system-prompt addendum and the
    run-card guide injected into AGENTS.md, byte-identical to the gpt-5.5
    cell so the two codex systems are directly comparable.
  notes: >-
    Campaign run 2026-08-10. n=5, no exclusions, integrity CLEAN. Tightest
    cell in the campaign (sd 0.007) and the only cell with pass^k = 1.00:
    every trial clears the 0.9 bar. SEED 1001 WAS RE-RUN. The original
    scored 0.000: it listed the sandbox with `rg --files -g '!results/**'`,
    never saw the output contract it had been given, wrote its own schema
    over the top with codex apply_patch `*** Add File:` (which overwrites
    silently and still reports kind="add"), validated its answer against its
    own substitute, and shipped `width_formula` where the contract requires
    `width_formula_mumu` -- zeroing physics otherwise worth 0.814, with the
    campaign's best yield accuracy (0.0249 dex). That is a destroyed output
    contract rather than a physics failure. The original trial is preserved
    IN FULL, with forensics, at
    runs/preserved/2026-08-10_gpt-5.6-sol_seed1001_contract-overwrite/, and
    the re-run (0.9309) was produced by `toolbench resume` into the same run
    directory under the same seed. toolbench b32747e now records
    `template_drift` per trial so this failure is never again invisible; the
    check is read-only with respect to the sandbox, so the re-run remains
    comparable to the other nine trials, which ran without it. Every trial
    in this cell, the re-run included, reports template_drift = {}.
    reach 0.9241 (sd 0.007) [0.916 0.916 0.927 0.930 0.931].
  valid: true
