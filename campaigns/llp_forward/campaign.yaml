- id: haiku4.5__bare__tools_defined
  system: Haiku 4.5
  arm: tools
  model: claude-haiku-4-5
  variant: bare
  loadout: tools_defined
  valid: false
  reason: >-
    EXCLUDED, not used anywhere in the manuscript. Two independent
    disqualifiers. (1) One trial (n002/seed1003) read the answer key: it ran
    `git show HEAD:benchmarks/llp_forward/soln/truth.json` together with
    `git ls-tree` and `git log --all --follow`, reaching the ground truth
    through git's object store, which the filesystem deny-list did not cover.
    It is quarantined under its run directory with a README. toolbench now
    denies `.git` of every repo containing a benchmark, but that fix
    postdates this run. (2) Both arms sat near reach 0.22-0.23 with the tools
    arm no better than core, which on inspection reflects the model failing
    the task rather than the toolkit failing to help -- and the cell would
    need re-running against heptapod 3.0.0 to be comparable with the rest of
    this campaign in any case. Recorded here so the exclusion is part of the
    ledger rather than a silent omission.
