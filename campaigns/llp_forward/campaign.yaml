- id: sonnet5__bare__core_only
  system: Sonnet 5
  arm: core
  model: claude-sonnet-5
  variant: bare
  loadout: core_only
  search: 2026-08-10T15-03-59_llp_forward-reach_claude-sonnet-5_run
  prefix: core_only__
  stack: >-
    toolbench 0.7.0 / toolbase 0.14.0 / orchestral 1.10.0; claude-code CLI
    2.1.226. (core arm: heptapod unused.)
  notes: >-
    Campaign run 2026-08-10. n=5, no exclusions, integrity CLEAN. The widest
    cell in the campaign (sd 0.329), and the spread is two specific trials.
    seed1003 scored 0.000: it derived the widths correctly (width_correct
    passed) but never produced results/scan.csv -- there is no .csv anywhere in
    its sandbox -- so the bulk deliverable, the yield scan the whole rubric is
    written against, is simply absent. answer_present gates on it and there is
    genuinely nothing downstream to score. This is NOT the width_correct
    absorption bug: that one zeroed a trial that HAD produced everything, and
    the trial it hit was tools/seed1005, which regrades to 0.9717 under the
    fixed rubric and sits in this campaign at that value. seed1005 scored 0.200,
    failing at channels_present with partial mass coverage. This is the largest
    tools-vs-core delta in the study and it is driven by core-arm unreliability
    rather than by a tools-arm ceiling. reach 0.4474 (sd 0.329) [0.000 0.200
    0.597 0.711 0.729] for seeds [1003 1005 1004 1001 1002].
  valid: true
