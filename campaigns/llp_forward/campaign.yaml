  notes: >-
    Campaign run 2026-08-10. n=5, no exclusions, integrity CLEAN. Tightest
    cell in the campaign alongside gpt-5.6 tools. Adopted the toolkit without
    being told to. reach 0.9686 (sd 0.016) [0.940 0.972 0.974 0.978 0.979].
