campaign: llp_forward
benchmark: benchmarks/llp_forward
description: >-
  Forward-LLP tool ablation on the BARE variant: bare x core_only against
  bare x tools_defined, four systems, n=5. The de-scaffolded rung -- the
  sandbox ships one file (the output contract) and everything the answer
  depends on is stated in the user prompt, so the tools arm's advantage
  cannot come from scaffolding both arms share. Supersedes
  llp_forward, which contrasted recipes x core_only against
  defined x tools_defined and therefore moved the variant axis and the
  loadout axis together; here only the loadout differs between arms.
n: 5
# Every `sd` quoted in a cell note is the SAMPLE standard deviation
# (ddof=1), matching the notebook's cross-configuration figure. At n=5 the
# population/sample choice moves the third decimal, so the convention is
# stated rather than left to be inferred.
seeds:
- 1001
- 1002
- 1003
- 1004
- 1005
frozen:
  toolkit: heptapod 3.0.0
  rubric_fingerprint: 6555a8797b4c
  prompt_fingerprint: c5f26ed700cb
  toolbench: 0.7.0
  toolbase: 0.14.0
  orchestral-ai: 1.10.0
  claude-code-cli: 2.1.225 / 2.1.226
  codex-cli: 0.146.0
  rubric_fingerprint_note: >-
    Was the llp_forward ladder until 2026-08-09, when the calibrated
    rubric (median |log10(agent/ref)| in dex, standardised by the reference's
    own measured MC precision) replaced the peak_yield + band_coarse/mid/fine
    tolerance ladder as the PARENT benchmark's rubric. The superseded ladder
    now lives in benchmarks/llp_forward_legacy so the 2026-07 and 2026-08
    campaigns stay reproducible. Changed again 2026-08-10 when width_correct
    was made NON-GATING: it is 0.10 of the rubric, not a precondition for the
    other 0.85, and as an absorbing gate it zeroed a Sonnet trial that scored
    0.977 on yields because its (correct) formula carried an equation label.
    Every cell here was regraded under 6555a8797b4c and re-verified idempotent
    on 2026-08-11 before collection.
  harness_note: >-
    claude-code CLI auto-updated mid-campaign: opus ran on 2.1.225, sonnet on
    2.1.226. Both codex cells ran codex-cli 0.146.0. Recorded per cell in
    `stack`.
  treatment_note: >-
    The codex cells carry a 343-character `system_prompt_addendum` on the
    tools loadout stating that a domain toolkit is served and preferred over
    reimplementation, plus the run-card guide injected into AGENTS.md at
    session start. Without it gpt-5.6 called ZERO domain tools across five
    trials and gpt-5.5 across three -- an arm that never reaches for its
    tools is not testing them. The claude-code cells received NO addendum:
    opus and sonnet both adopted the toolkit unprompted. The asymmetry is a
    harness difference, is recorded verbatim in every trial record, and must
    be stated in the manuscript. It reaches the TOOLS arm only; a core arm
    can never receive prose describing tools it does not have.
domain_tools:
- ProductionSpectrum
- HarvestForwardFlux
- MesonDecayToLLP
- DecayInVolumeVsCoupling
- DecayInVolumeVsLifetime
- PythiaFromRunCard
systems:
- Opus 4.8
- Sonnet 5
- Codex GPT-5.5
- Codex GPT-5.6
cells:
- id: opus4.8__bare__tools_defined
  system: Opus 4.8
  arm: tools
  model: claude-opus-4-8
  variant: bare
  loadout: tools_defined
  search: 2026-08-10T01-46-52_llp_forward-reach_claude-opus-4-8_run
  prefix: tools_defined__
  stack: >-
    heptapod 3.0.0 (venv); toolbench 0.7.0 / toolbase 0.14.0 / orchestral
