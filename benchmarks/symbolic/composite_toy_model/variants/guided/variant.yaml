name: guided
description: |
  Generic presentation of the composite task: one toy Lagrangian, nine
  numeric deliverables (widths, BRs, lifetime, annihilation cross
  section). The internal-consistency stage grades the agent's own
  numbers against each other, separating bookkeeping discipline from
  per-quantity accuracy.

axes:
  spec: full
  env: bare

user_prompt_file: ./prompts/user.md
system_prompt_file: ./prompts/system.md
