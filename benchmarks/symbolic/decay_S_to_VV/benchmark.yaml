name: symbolic-decay_S_to_VV
version: "1.0.0"
description: |
  Tree-level two-body width of a real scalar into two massive vectors
  (the H->WW/ZZ archetype): (a) identical vectors L = g S V_mu V^mu (the
  SVV vertex factor 2 AND the identical-particle symmetry factor are the
  traps; result carries the famous (1-4x+12x^2) longitudinal factor),
  (b) distinct vectors. Exact numeric widths (GeV) + closed-form formulas.
  Ground truth derived and verified in ground_truth/derivation.py (Djouadi
  arXiv:hep-ph/0503172 sec. 2.2; conventions in ../CONVENTIONS.md).

default_harness: orchestral/anthropic
default_loadout: core_only
default_variant: unguided

ground_truth:
  dir: ./ground_truth

checks: ../_shared/checks.py

artifacts:
  keep_full: [".json", ".py", ".md", ".wl", ".txt"]
  keep_root: ["todos.md"]

rubric:
  type: stagewise
  # Stage independence: `answer_present` is a real prerequisite and gates
  # (no file -> nothing else is assessable). Every other stage here grades a
  # SEPARATE quantity or a separate rung of a nested tolerance ladder, so
  # none of them presuppose the one before -- part (b) being right does not
  # depend on part (a)'s formula. They are therefore non-gating: a miss
  # costs its own weight and nothing else. The ladder stays self-consistent
  # without absorption, since a value within 1% is necessarily within 10%
  # and within half a decade.
  stages:
    - id: answer_present
      description: results/answer.json exists with all 4 answer fields.
      weight: 0.04
      checks:
        - json_with_keys:
            file: results/answer.json
            required_keys: [part_a_width_gev, part_a_width_formula, part_b_width_gev, part_b_width_formula]
    - id: a_order_of_magnitude
      gating: false
      description: Part (a) within half a decade (NDA-passable rung).
      weight: 0.06
      checks:
        - answer_value:
            file: results/answer.json
            field: part_a_width_gev
            reference: ground_truth/truth.json
            log10_tol: 0.5
    - id: a_within_10pct
      gating: false
      description: Part (a) within 10%.
      weight: 0.09
      checks:
        - answer_value:
            file: results/answer.json
            field: part_a_width_gev
            reference: ground_truth/truth.json
            rel_tol: 0.1
    - id: a_within_1pct
      gating: false
      description: Part (a) within 1% (exact-computation rung).
      weight: 0.12
      checks:
        - answer_value:
            file: results/answer.json
            field: part_a_width_gev
            reference: ground_truth/truth.json
            rel_tol: 0.01
    - id: a_formula
      gating: false
      description: Part (a) closed form matches at sampled points.
      weight: 0.21
      checks:
        - answer_formula:
            file: results/answer.json
            field: part_a_width_formula
            reference: ground_truth/truth.json
            symbols: {g: [10.0, 300.0], mS: [500.0, 2000.0], mV: [50.0, 200.0]}
            constraints: ["mS**2 - 4*mV**2"]
    - id: b_order_of_magnitude
      gating: false
      description: Part (b) within half a decade (NDA-passable rung).
      weight: 0.06
      checks:
        - answer_value:
            file: results/answer.json
            field: part_b_width_gev
            reference: ground_truth/truth.json
            log10_tol: 0.5
    - id: b_within_10pct
      gating: false
      description: Part (b) within 10%.
      weight: 0.09
      checks:
        - answer_value:
            file: results/answer.json
            field: part_b_width_gev
            reference: ground_truth/truth.json
            rel_tol: 0.1
    - id: b_within_1pct
      gating: false
      description: Part (b) within 1% (exact-computation rung).
      weight: 0.12
      checks:
        - answer_value:
            file: results/answer.json
            field: part_b_width_gev
            reference: ground_truth/truth.json
            rel_tol: 0.01
    - id: b_formula
      gating: false
      description: Part (b) closed form matches at sampled points.
      weight: 0.21
      checks:
        - answer_formula:
            file: results/answer.json
            field: part_b_width_formula
            reference: ground_truth/truth.json
            symbols: {g: [10.0, 300.0], mS: [800.0, 2500.0], m1: [50.0, 300.0], m2: [50.0, 300.0]}
            constraints: ["mS**2 - (m1+m2)**2"]
