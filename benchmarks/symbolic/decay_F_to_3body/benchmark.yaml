name: symbolic-decay_F_to_3body
version: "1.0.0"
extends: ../_shared
description: |
  Muon-decay-shaped three-body width of a heavy fermion through a
  heavy mediator (leading order in m_F/M): (a) vector mediator with
  left-handed couplings (Gamma = g^4 m_F^5 / (1536 pi^3 M_V^4) in the
  stated normalization — recalling G_F^2 m^5/(192 pi^3) is not enough,
  the coupling matching is the content), (b) scalar mediator with
  Yukawa couplings (same 1536 coefficient, a non-obvious coincidence of
  the contraction topology). Exact numeric widths (GeV) + closed-form
  formulas in results/answer.json. Ground truth derived (master
  phase-space integral worked in ground_truth/derivation.py) and
  verified by numeric Dalitz integration of explicit-spinor contact
  amplitudes; integrator anchored to the muon width in tests/.

ground_truth:
  dir: ./ground_truth

artifacts:
  keep_full: [".json", ".py", ".md", ".wl", ".txt"]
  keep_root: ["todos.md"]

rubric:
  type: stagewise
  # Stage independence: `answer_present` is a real prerequisite and gates
  # (no file -> nothing else is assessable). Every other stage here grades a
  # SEPARATE quantity or a separate rung of a nested tolerance ladder, so
  # none of them presuppose the one before -- part (b) being right does not
  # depend on part (a)'s formula. They are therefore non-gating: a miss
  # costs its own weight and nothing else. The ladder stays self-consistent
  # without absorption, since a value within 1% is necessarily within 10%
  # and within half a decade.
  stages:
    - id: answer_present
      description: results/answer.json exists with all four answer fields.
      weight: 0.04
      checks:
        - json_with_keys:
            file: results/answer.json
            required_keys: [part_a_width_gev, part_a_width_formula,
                            part_b_width_gev, part_b_width_formula]

    # ----- part (a): heavy vector mediator, left-handed -----
    - id: a_order_of_magnitude
      gating: false
      description: Part (a) width within half a decade (NDA-passable rung).
      weight: 0.06
      checks:
        - answer_value:
            file: results/answer.json
            field: part_a_width_gev
            reference: ground_truth/truth.json
            log10_tol: 0.5
    - id: a_within_10pct
      gating: false
      description: Part (a) width within 10%.
      weight: 0.09
      checks:
        - answer_value:
            file: results/answer.json
            field: part_a_width_gev
            reference: ground_truth/truth.json
            rel_tol: 0.10
    - id: a_within_1pct
      gating: false
      description: Part (a) width within 1% (catches a wrong Fermi matching).
      weight: 0.12
      checks:
        - answer_value:
            file: results/answer.json
            field: part_a_width_gev
            reference: ground_truth/truth.json
            rel_tol: 0.01
    - id: a_formula
      gating: false
      description: Part (a) closed form matches at sampled (g, mF, MV).
      weight: 0.21
      checks:
        - answer_formula:
            file: results/answer.json
            field: part_a_width_formula
            reference: ground_truth/truth.json
            symbols: {g: [0.1, 1.5], mF: [1.0, 100.0],
                      MV: [1000.0, 5000.0]}

    # ----- part (b): heavy scalar mediator, Yukawa -----
    - id: b_order_of_magnitude
      gating: false
      description: Part (b) width within half a decade.
      weight: 0.06
      checks:
        - answer_value:
            file: results/answer.json
            field: part_b_width_gev
            reference: ground_truth/truth.json
            log10_tol: 0.5
    - id: b_within_10pct
      gating: false
      description: Part (b) width within 10%.
      weight: 0.09
      checks:
        - answer_value:
            file: results/answer.json
            field: part_b_width_gev
            reference: ground_truth/truth.json
            rel_tol: 0.10
    - id: b_within_1pct
      gating: false
      description: Part (b) width within 1%.
      weight: 0.12
      checks:
        - answer_value:
            file: results/answer.json
            field: part_b_width_gev
            reference: ground_truth/truth.json
            rel_tol: 0.01
    - id: b_formula
      gating: false
      description: Part (b) closed form matches at sampled (y1, y2, mF, MS).
      weight: 0.21
      checks:
        - answer_formula:
            file: results/answer.json
            field: part_b_width_formula
            reference: ground_truth/truth.json
            symbols: {y1: [0.1, 1.5], y2: [0.1, 1.5],
                      mF: [1.0, 100.0], MS: [1000.0, 5000.0]}
