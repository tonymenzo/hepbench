name: guided
description: |
  Generic presentation. The Lagrangians are stated with explicit
  mediator couplings (NOT in Fermi form), so recalling
  G_F^2 m^5/(192 pi^3) only helps if the coupling matching to the
  stated normalization is done correctly — that matching is what the
  upper rungs grade.

axes:
  spec: full
  env: bare

user_prompt_file: ./prompts/user.md
system_prompt_file: ./prompts/system.md
