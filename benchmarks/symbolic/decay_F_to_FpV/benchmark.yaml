name: symbolic-decay_F_to_FpV
version: "1.0.0"
extends: ../_shared
description: |
  Tree-level two-body width of a heavy Dirac fermion into a lighter
  fermion plus a massive vector (the t->bW archetype): (a) pure vector
  coupling, (b) general chiral coupling L = fbar gamma^mu(gL PL + gR PR) F
  V_mu + h.c. The massive-vector polarization sum (with its longitudinal
  p^mu p^nu/m_V^2 piece) is the content. Exact numeric widths (GeV) +
  closed-form formulas in results/answer.json. Ground truth derived and
  verified in ground_truth/derivation.py (reduces to the textbook t->bW
  width; conventions in ../CONVENTIONS.md).

ground_truth:
  dir: ./ground_truth

artifacts:
  keep_full: [".json", ".py", ".md", ".wl", ".txt"]
  keep_root: ["todos.md"]

rubric:
  type: stagewise
  # Stage independence: `answer_present` is a real prerequisite and gates
  # (no file -> nothing else is assessable). Every other stage here grades a
  # SEPARATE quantity or a separate rung of a nested tolerance ladder, so
  # none of them presuppose the one before -- part (b) being right does not
  # depend on part (a)'s formula. They are therefore non-gating: a miss
  # costs its own weight and nothing else. The ladder stays self-consistent
  # without absorption, since a value within 1% is necessarily within 10%
  # and within half a decade.
  stages:
    - id: answer_present
      description: results/answer.json exists with all 4 answer fields.
      weight: 0.04
      checks:
        - json_with_keys:
            file: results/answer.json
            required_keys: [part_a_width_gev, part_a_width_formula, part_b_width_gev, part_b_width_formula]
    - id: a_order_of_magnitude
      gating: false
      description: Part (a) within half a decade (NDA-passable rung).
      weight: 0.06
      checks:
        - answer_value:
            file: results/answer.json
            field: part_a_width_gev
            reference: ground_truth/truth.json
            log10_tol: 0.5
    - id: a_within_10pct
      gating: false
      description: Part (a) within 10%.
      weight: 0.09
      checks:
        - answer_value:
            file: results/answer.json
            field: part_a_width_gev
            reference: ground_truth/truth.json
            rel_tol: 0.1
    - id: a_within_1pct
      gating: false
      description: Part (a) within 1% (exact-computation rung).
      weight: 0.12
      checks:
        - answer_value:
            file: results/answer.json
            field: part_a_width_gev
            reference: ground_truth/truth.json
            rel_tol: 0.01
    - id: a_formula
      gating: false
      description: Part (a) closed form matches at sampled points.
      weight: 0.21
      checks:
        - answer_formula:
            file: results/answer.json
            field: part_a_width_formula
            reference: ground_truth/truth.json
            symbols: {g: [0.1, 1.5], mF: [2000.0, 5000.0], mf: [10.0, 400.0], mV: [50.0, 400.0]}
            constraints: ["mF**2 - (mf+mV)**2"]
    - id: b_order_of_magnitude
      gating: false
      description: Part (b) within half a decade (NDA-passable rung).
      weight: 0.06
      checks:
        - answer_value:
            file: results/answer.json
            field: part_b_width_gev
            reference: ground_truth/truth.json
            log10_tol: 0.5
    - id: b_within_10pct
      gating: false
      description: Part (b) within 10%.
      weight: 0.09
      checks:
        - answer_value:
            file: results/answer.json
            field: part_b_width_gev
            reference: ground_truth/truth.json
            rel_tol: 0.1
    - id: b_within_1pct
      gating: false
      description: Part (b) within 1% (exact-computation rung).
      weight: 0.12
      checks:
        - answer_value:
            file: results/answer.json
            field: part_b_width_gev
            reference: ground_truth/truth.json
            rel_tol: 0.01
    - id: b_formula
      gating: false
      description: Part (b) closed form matches at sampled points.
      weight: 0.21
      checks:
        - answer_formula:
            file: results/answer.json
            field: part_b_width_formula
            reference: ground_truth/truth.json
            symbols: {gL: [0.05, 1.5], gR: [0.05, 1.5], mF: [2000.0, 5000.0], mf: [10.0, 400.0], mV: [50.0, 400.0]}
            constraints: ["mF**2 - (mf+mV)**2"]
