name: symbolic-decay_F_to_FprimeS
version: "1.0.0"
extends: ../_shared
description: |
  Tree-level two-body width of a heavy Dirac fermion into a lighter
  fermion plus a real scalar: (a) scalar Yukawa L = -y phi psibar Psi
  + h.c., (b) chiral L = -phi psibar (yL PL + yR PR) Psi + h.c. (the
  t -> b H+ / vector-like-fermion structure; note the +4 yL yR mF mf
  interference sign, opposite to the scalar -> f1 f2bar case). Exact
  numeric widths (GeV) + closed-form formulas in results/answer.json.
  Ground truth derived and verified in ground_truth/derivation.py
  (Djouadi arXiv:hep-ph/0503173 sec. 1.3.4; Aguilar-Saavedra
  arXiv:0907.3155 appendix).

ground_truth:
  dir: ./ground_truth

artifacts:
  keep_full: [".json", ".py", ".md", ".wl", ".txt"]
  keep_root: ["todos.md"]

rubric:
  type: stagewise
  # Stage independence: `answer_present` is a real prerequisite and gates
  # (no file -> nothing else is assessable). Every other stage here grades a
  # SEPARATE quantity or a separate rung of a nested tolerance ladder, so
  # none of them presuppose the one before -- part (b) being right does not
  # depend on part (a)'s formula. They are therefore non-gating: a miss
  # costs its own weight and nothing else. The ladder stays self-consistent
  # without absorption, since a value within 1% is necessarily within 10%
  # and within half a decade.
  stages:
    - id: answer_present
      description: results/answer.json exists with all four answer fields.
      weight: 0.04
      checks:
        - json_with_keys:
            file: results/answer.json
            required_keys: [part_a_width_gev, part_a_width_formula,
                            part_b_width_gev, part_b_width_formula]

    # ----- part (a): scalar Yukawa -----
    - id: a_order_of_magnitude
      gating: false
      description: Part (a) width within half a decade (NDA-passable rung).
      weight: 0.06
      checks:
        - answer_value:
            file: results/answer.json
            field: part_a_width_gev
            reference: ground_truth/truth.json
            log10_tol: 0.5
    - id: a_within_10pct
      gating: false
      description: Part (a) width within 10%.
      weight: 0.09
      checks:
        - answer_value:
            file: results/answer.json
            field: part_a_width_gev
            reference: ground_truth/truth.json
            rel_tol: 0.10
    - id: a_within_1pct
      gating: false
      description: Part (a) width within 1%.
      weight: 0.12
      checks:
        - answer_value:
            file: results/answer.json
            field: part_a_width_gev
            reference: ground_truth/truth.json
            rel_tol: 0.01
    - id: a_formula
      gating: false
      description: Part (a) closed form matches at sampled (y, mF, mf, mS).
      weight: 0.21
      checks:
        - answer_formula:
            file: results/answer.json
            field: part_a_width_formula
            reference: ground_truth/truth.json
            symbols: {y: [0.1, 2.0], mF: [1500.0, 4000.0],
                      mf: [10.0, 600.0], mS: [10.0, 600.0]}

    # ----- part (b): chiral coupling -----
    - id: b_order_of_magnitude
      gating: false
      description: Part (b) width within half a decade.
      weight: 0.06
      checks:
        - answer_value:
            file: results/answer.json
            field: part_b_width_gev
            reference: ground_truth/truth.json
            log10_tol: 0.5
    - id: b_within_10pct
      gating: false
      description: Part (b) width within 10%.
      weight: 0.09
      checks:
        - answer_value:
            file: results/answer.json
            field: part_b_width_gev
            reference: ground_truth/truth.json
            rel_tol: 0.10
    - id: b_within_1pct
      gating: false
      description: Part (b) width within 1% (catches the interference sign).
      weight: 0.12
      checks:
        - answer_value:
            file: results/answer.json
            field: part_b_width_gev
            reference: ground_truth/truth.json
            rel_tol: 0.01
    - id: b_formula
      gating: false
      description: Part (b) closed form matches at sampled couplings/masses.
      weight: 0.21
      checks:
        - answer_formula:
            file: results/answer.json
            field: part_b_width_formula
            reference: ground_truth/truth.json
            symbols: {yL: [0.05, 1.5], yR: [0.05, 1.5],
                      mF: [1500.0, 4000.0], mf: [10.0, 600.0],
                      mS: [10.0, 600.0]}
