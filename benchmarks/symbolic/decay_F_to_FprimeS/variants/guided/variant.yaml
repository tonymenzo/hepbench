name: guided
description: |
  Generic presentation (no SM particle names). Part (b)'s chiral
  interference term has the opposite sign to the scalar -> f1 f2bar
  case (decay to a fermion, not an antifermion) — a conventions probe
  that recall alone tends to get wrong.

axes:
  spec: full
  env: bare

user_prompt_file: ./prompts/user.md
system_prompt_file: ./prompts/system.md
