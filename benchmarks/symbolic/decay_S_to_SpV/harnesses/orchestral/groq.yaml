# Groq route (direct, not via the LiteLLM proxy). Credentials come from
# GROQ_API_KEY in .env; orchestral's Groq client defaults to
# openai/gpt-oss-120b, but the model always comes from --models. Use when
# litellm.fnal.gov is unreachable. COST: orchestral prices groq itself, so
# --max-cost-usd binds -- but the lookup is an exact string match with no
# default rate, so pass the fully-qualified `openai/gpt-oss-120b` (a bare
# `gpt-oss-120b` silently costs 0.00 and the cap never trips).
#   toolbench run ... --harness orchestral/groq --models openai/gpt-oss-120b
name: orchestral/groq
runtime:
  name: orchestral
  version: ">=1.3"
provider:
  name: groq
  max_tokens: 8192
# Anti-oracle tool policy (see benchmarks/symbolic/README.md):
#  - WebSearchTool removed: every formula here is published, so the web
#    is an oracle.
#  - RunCommandTool removed: a shell is the natural way to `cat`/`find`
#    the ground truth, and the tasks never need one. The filesystem
#    tools (Read/Find/FileSearch) are jailed to the sandbox by
#    orchestral; RunPythonTool is kept for legitimate computation (its
#    open() is a residual read leak, caught post-hoc by
#    scripts/audit_oracle_access.py).
core:
  tools: [WriteFileTool, ReadFileTool, EditFileTool,
          FindFilesTool, FileSearchTool, RunPythonTool,
          TodoRead, TodoWrite]
loop:
  max_iterations: 60
  # Raised from 2: gpt-oss-class models emit malformed tool-call JSON
  # often enough that 2 resumes were exhausted on 3 of 14 sweep
  # benchmarks, losing the whole trial. The crash is nondeterministic
  # and a resume costs ~$0.005 against a trial that otherwise scores 0.
  # Kept uniform across the family: an arm with fewer retries would
  # show a lower reach for loop-policy reasons, not capability ones.
  max_format_retries: 5
  continue_nudges: 0
