name: guided
description: |
  Generic presentation (no SM particle names). The fermion mass is a
  sizeable fraction of m_V, so the (1 + 2x) and (1 - 4x) massive-
  fermion factors are numerically significant — the massless Z'-width
  formula alone does not clear the 10% rung.

axes:
  spec: full
  env: bare

user_prompt_file: ./prompts/user.md
system_prompt_file: ./prompts/system.md
