# Domain arm: core_only plus ComputeDecayRate and ComputeCrossSection served by
# toolbase. The addendum names them as the intended path and reaches only this arm.
name: tools_eda
tools:
  sources:
    - toolbase: { loadout: symbolic-eda }
skills: []
system_prompt_addendum: |
  You have symbolic amplitude tools available: ComputeDecayRate and
  ComputeCrossSection. Given a tree-level diagram you specify -- particle
  labels, spins and masses, plus the vertex type and coupling -- each one
  generates the FeynCalc, runs it, and returns the closed-form result together
  with its numeric value in a single call.

  They are the intended path for exact amplitude work on this task: prefer
  them over deriving and evaluating the amplitude by hand. If a call is
  refused, the error states what the tool expected; correct the diagram rather
  than abandoning the tool.

  Check what the tool reports back against the process you meant to compute --
  `vertex_structures` names the vertex it actually built, and
  `symmetry_factor` and `n_initial_spin_states` name the prefactors it
  applied.
