# In-process orchestral agent on the LiteLLM proxy (LITELLM_HOST, LITELLM_API_KEY).
name: orchestral/litellm
runtime:
  name: orchestral
  version: ">=1.3"
provider:
  name: litellm
  max_tokens: 8192
  cache_bust: true                     # per-trial nonce, in case the proxy caches responses
core:
  tools: [WriteFileTool, ReadFileTool, EditFileTool,
          FindFilesTool, FileSearchTool, RunPythonTool,
          TodoRead, TodoWrite]
loop:
  max_iterations: 60
  max_format_retries: 5                # resume after a malformed tool call
  continue_nudges: 0                   # no resume when the agent stops early
