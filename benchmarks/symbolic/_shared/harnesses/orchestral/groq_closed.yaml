# Closed-book arm: no execution tools, so the derivation and arithmetic happen in-context.
# File tools remain only to write results/answer.json. Run with --loadouts core_only.
name: orchestral/groq_closed
runtime:
  name: orchestral
  version: ">=1.3"
provider:
  name: groq
  max_tokens: 16384
core:
  tools: [WriteFileTool, ReadFileTool, TodoRead, TodoWrite]
loop:
  max_iterations: 20
  max_format_retries: 5                # resume after a malformed tool call
  continue_nudges: 0                   # no resume when the agent stops early
