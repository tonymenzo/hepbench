# In-process orchestral agent on Groq (GROQ_API_KEY). Pass the fully qualified model,
# e.g. --model openai/gpt-oss-120b; a bare name has no price entry and --max-cost-usd never binds.
name: orchestral/groq
runtime:
  name: orchestral
  version: ">=1.3"
provider:
  name: groq
  max_tokens: 8192
core:
  tools: [WriteFileTool, ReadFileTool, EditFileTool,
          FindFilesTool, FileSearchTool, RunPythonTool,
          TodoRead, TodoWrite]
loop:
  max_iterations: 60
  max_format_retries: 5                # resume after a malformed tool call
  continue_nudges: 0                   # no resume when the agent stops early
