# Codex CLI (`codex exec`) under the user's subscription. The model comes from --model.
name: codex/default
runtime:
  name: codex
  call_timeout_s: 3600                 # per MCP call, seconds
  sandbox: workspace-write             # Codex's own sandbox; no network, and the benchmark tree is denied
  reasoning_effort: medium
provider:
  name: subscription                   # the CLI owns the model call
core:
  builtin: true                        # Codex's own tools; MCP tools come from the loadout
loop:
  ux_feedback: graded                  # two unscored post-trial turns: a critique of the served tools
  max_format_retries: 5                # resume after a malformed tool call
  continue_nudges: 0                   # no resume when the agent stops early
  max_rate_limit_retries: 3
