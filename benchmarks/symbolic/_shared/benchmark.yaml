# Assets shared by every task in the symbolic family. Each task declares
# `extends: ../_shared` and inherits the harnesses, loadouts, checks and
# defaults below; a task-local file of the same name shadows the shared one.
# This directory is not a runnable benchmark: it has no rubric or variants.
name: symbolic-shared
version: "1.0.0"

default_harness: orchestral/anthropic
default_loadout: core_only
default_variant: unguided

checks: ./checks.py
