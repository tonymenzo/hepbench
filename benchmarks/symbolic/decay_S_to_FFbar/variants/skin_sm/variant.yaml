name: skin_sm
description: |
  Standard-Model skin: identical physics, conventions, AND parameter
  values to `guided` (so the ground truth and grading are unchanged),
  but presented with real particle names from a two-Higgs-doublet-like
  sector (CP-even H, CP-odd A, charged H+ decaying to named fermions)
  instead of generic fields. Paired against `guided`, this isolates the
  recall-vs-computation effect: does naming the states prime better
  recall, or hurt by pattern-matching to a memorised formula that is
  wrong at these (deliberately non-SM) parameter values? The numbers are
  hypothetical on purpose, to keep the answer non-memorisable.

axes:
  spec: full        # fully scaffolded, like default
  skin: sm          # real particle names instead of generic fields
  env: bare

user_prompt_file: ./prompts/user.md
system_prompt_file: ./prompts/system.md
