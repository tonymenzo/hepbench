name: symbolic-decay_S_to_FFbar
version: "1.0.0"
# Curated for the results site: nickname_tex renders as MathML; summary is the
# one-line blurb shown in class listings (the full description stays below).
nickname_tex: S \to f\bar f
summary: >-
  Tree-level widths of a real scalar into fermion pairs across scalar,
  pseudoscalar, and chiral Yukawa couplings.
description: |
  Tree-level two-body widths of a generic real scalar into fermion
  pairs, in three interaction structures: (a) scalar Yukawa
  L = -y phi psibar psi (beta^3 law), (b) pseudoscalar
  L = -i y phi psibar gamma_5 psi (beta^1 law), (c) chiral
  L = -phi psibar_1 (yL PL + yR PR) psi_2 + h.c. with unequal final
  masses. The agent must return exact numeric partial widths (GeV) and
  closed-form formulas in results/answer.json. Formulas are graded by
  numeric sampling over a declared symbol domain; values climb a
  tolerance ladder (order-of-magnitude -> 10% -> 1%) so the NDA arm
  registers on the first rung while only an exact computation (EDA arm
  or correct hand derivation) clears the upper rungs. Ground truth is
  derived and independently verified in ground_truth/derivation.py
  (literature: Djouadi, arXiv:hep-ph/0503172 sec. 2.3 and
  arXiv:hep-ph/0503173 secs. 1.2.2, 1.3.4).

default_harness: orchestral/anthropic
default_loadout: core_only
default_variant: unguided

ground_truth:
  dir: ./ground_truth

checks: ../_shared/checks.py

artifacts:
  keep_full: [".json", ".py", ".md", ".wl", ".txt"]
  keep_root: ["todos.md"]

rubric:
  type: stagewise
  # Stage independence: `answer_present` is a real prerequisite and gates
  # (no file -> nothing else is assessable). Every other stage here grades a
  # SEPARATE quantity or a separate rung of a nested tolerance ladder, so
  # none of them presuppose the one before -- part (b) being right does not
  # depend on part (a)'s formula. They are therefore non-gating: a miss
  # costs its own weight and nothing else. The ladder stays self-consistent
  # without absorption, since a value within 1% is necessarily within 10%
  # and within half a decade.
  stages:
    - id: answer_present
      description: results/answer.json exists with all six answer fields.
      weight: 0.04
      checks:
        - json_with_keys:
            file: results/answer.json
            required_keys: [part_a_width_gev, part_a_width_formula,
                            part_b_width_gev, part_b_width_formula,
                            part_c_width_gev, part_c_width_formula]

    # ----- part (a): scalar Yukawa, beta^3 -----
    - id: a_order_of_magnitude
      gating: false
      description: Part (a) width within half a decade (NDA-passable rung).
      weight: 0.04
      checks:
        - answer_value:
            file: results/answer.json
            field: part_a_width_gev
            reference: ground_truth/truth.json
            log10_tol: 0.5
    - id: a_within_10pct
      gating: false
      description: Part (a) width within 10%.
      weight: 0.06
      checks:
        - answer_value:
            file: results/answer.json
            field: part_a_width_gev
            reference: ground_truth/truth.json
            rel_tol: 0.10
    - id: a_within_1pct
      gating: false
      description: Part (a) width within 1% (exact-computation rung).
      weight: 0.08
      checks:
        - answer_value:
            file: results/answer.json
            field: part_a_width_gev
            reference: ground_truth/truth.json
            rel_tol: 0.01
    - id: a_formula
      gating: false
      description: Part (a) closed form matches at sampled (y, mS, mf).
      weight: 0.14
      checks:
        - answer_formula:
            file: results/answer.json
            field: part_a_width_formula
            reference: ground_truth/truth.json
            symbols: {y: [0.1, 2.0], mS: [500.0, 3000.0], mf: [1.0, 200.0]}

    # ----- part (b): pseudoscalar, beta^1 -----
    - id: b_order_of_magnitude
      gating: false
      description: Part (b) width within half a decade.
      weight: 0.04
      checks:
        - answer_value:
            file: results/answer.json
            field: part_b_width_gev
            reference: ground_truth/truth.json
            log10_tol: 0.5
    - id: b_within_10pct
      gating: false
      description: Part (b) width within 10%.
      weight: 0.06
      checks:
        - answer_value:
            file: results/answer.json
            field: part_b_width_gev
            reference: ground_truth/truth.json
            rel_tol: 0.10
    - id: b_within_1pct
      gating: false
      description: Part (b) width within 1%.
      weight: 0.08
      checks:
        - answer_value:
            file: results/answer.json
            field: part_b_width_gev
            reference: ground_truth/truth.json
            rel_tol: 0.01
    - id: b_formula
      gating: false
      description: Part (b) closed form matches at sampled (y, mS, mf).
      weight: 0.14
      checks:
        - answer_formula:
            file: results/answer.json
            field: part_b_width_formula
            reference: ground_truth/truth.json
            symbols: {y: [0.1, 2.0], mS: [500.0, 3000.0], mf: [1.0, 200.0]}

    # ----- part (c): chiral coupling, unequal masses -----
    - id: c_order_of_magnitude
      gating: false
      description: Part (c) width within half a decade.
      weight: 0.04
      checks:
        - answer_value:
            file: results/answer.json
            field: part_c_width_gev
            reference: ground_truth/truth.json
            log10_tol: 0.5
    - id: c_within_10pct
      gating: false
      description: Part (c) width within 10%.
      weight: 0.06
      checks:
        - answer_value:
            file: results/answer.json
            field: part_c_width_gev
            reference: ground_truth/truth.json
            rel_tol: 0.10
    - id: c_within_1pct
      gating: false
      description: Part (c) width within 1%.
      weight: 0.08
      checks:
        - answer_value:
            file: results/answer.json
            field: part_c_width_gev
            reference: ground_truth/truth.json
            rel_tol: 0.01
    - id: c_formula
      gating: false
      description: Part (c) closed form matches at sampled couplings/masses.
      weight: 0.14
      checks:
        - answer_formula:
            file: results/answer.json
            field: part_c_width_formula
            reference: ground_truth/truth.json
            symbols: {yL: [0.05, 1.5], yR: [0.05, 1.5],
                      mS: [800.0, 3000.0], m1: [10.0, 350.0],
                      m2: [10.0, 350.0]}
