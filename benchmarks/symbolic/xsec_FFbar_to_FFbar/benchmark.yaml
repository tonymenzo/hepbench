name: symbolic-xsec_FFbar_to_FFbar
version: "1.0.0"
extends: ../_shared
description: |
  Tree-level s-channel annihilation of a massless fermion pair into a
  distinct massless fermion pair: (a) massless vector mediator (the
  e+e- -> mu+mu- structure with generic g: sigma = g^4/(12 pi s)),
  (b) heavy scalar mediator off resonance
  (sigma = y1^2 y2^2 s / (16 pi (s - MS^2)^2), isotropic). Numeric
  answers in PICOBARNS; formulas in natural units. Ground truth derived
  and verified in ground_truth/derivation.py (P&S eq. (5.13); explicit-
  spinor numeric integration).

ground_truth:
  dir: ./ground_truth

artifacts:
  keep_full: [".json", ".py", ".md", ".wl", ".txt"]
  keep_root: ["todos.md"]

rubric:
  type: stagewise
  # Stage independence: `answer_present` is a real prerequisite and gates
  # (no file -> nothing else is assessable). Every other stage here grades a
  # SEPARATE quantity or a separate rung of a nested tolerance ladder, so
  # none of them presuppose the one before -- part (b) being right does not
  # depend on part (a)'s formula. They are therefore non-gating: a miss
  # costs its own weight and nothing else. The ladder stays self-consistent
  # without absorption, since a value within 1% is necessarily within 10%
  # and within half a decade.
  stages:
    - id: answer_present
      description: results/answer.json exists with all four answer fields.
      weight: 0.04
      checks:
        - json_with_keys:
            file: results/answer.json
            required_keys: [part_a_xsec_pb, part_a_xsec_formula,
                            part_b_xsec_pb, part_b_xsec_formula]

    # ----- part (a): massless vector mediator -----
    - id: a_order_of_magnitude
      gating: false
      description: Part (a) cross section within half a decade.
      weight: 0.06
      checks:
        - answer_value:
            file: results/answer.json
            field: part_a_xsec_pb
            reference: ground_truth/truth.json
            log10_tol: 0.5
    - id: a_within_10pct
      gating: false
      description: Part (a) cross section within 10%.
      weight: 0.09
      checks:
        - answer_value:
            file: results/answer.json
            field: part_a_xsec_pb
            reference: ground_truth/truth.json
            rel_tol: 0.10
    - id: a_within_1pct
      gating: false
      description: Part (a) cross section within 1%.
      weight: 0.12
      checks:
        - answer_value:
            file: results/answer.json
            field: part_a_xsec_pb
            reference: ground_truth/truth.json
            rel_tol: 0.01
    - id: a_formula
      gating: false
      description: Part (a) closed form (GeV^-2) matches at sampled (g, s).
      weight: 0.21
      checks:
        - answer_formula:
            file: results/answer.json
            field: part_a_xsec_formula
            reference: ground_truth/truth.json
            symbols: {g: [0.1, 1.5], s: [100000.0, 4000000.0]}

    # ----- part (b): heavy scalar mediator, off resonance -----
    - id: b_order_of_magnitude
      gating: false
      description: Part (b) cross section within half a decade.
      weight: 0.06
      checks:
        - answer_value:
            file: results/answer.json
            field: part_b_xsec_pb
            reference: ground_truth/truth.json
            log10_tol: 0.5
    - id: b_within_10pct
      gating: false
      description: Part (b) cross section within 10%.
      weight: 0.09
      checks:
        - answer_value:
            file: results/answer.json
            field: part_b_xsec_pb
            reference: ground_truth/truth.json
            rel_tol: 0.10
    - id: b_within_1pct
      gating: false
      description: Part (b) cross section within 1%.
      weight: 0.12
      checks:
        - answer_value:
            file: results/answer.json
            field: part_b_xsec_pb
            reference: ground_truth/truth.json
            rel_tol: 0.01
    - id: b_formula
      gating: false
      description: Part (b) closed form (GeV^-2) matches at sampled points.
      weight: 0.21
      checks:
        - answer_formula:
            file: results/answer.json
            field: part_b_xsec_formula
            reference: ground_truth/truth.json
            symbols: {y1: [0.1, 1.5], y2: [0.1, 1.5],
                      s: [100000.0, 1000000.0],
                      MS: [1500.0, 5000.0]}
            constraints: ["MS**2 - s"]
