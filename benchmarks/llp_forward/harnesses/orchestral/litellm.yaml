# llp_forward family policy: NO WebSearchTool in any harness arm — the
# reach study is graded against hidden holdout probes and a committed
# reference contour, so web access is oracle access (spec section 11).
# Full settable-key reference: toolbench/harness_templates/orchestral.yaml
name: orchestral/litellm
runtime:
  name: orchestral
  version: ">=1.3"
provider:
  name: litellm           # routes via the LiteLLM proxy (LITELLM_HOST / LITELLM_API_KEY)
  max_tokens: 8192
core:
  tools: [RunCommandTool, WriteFileTool, ReadFileTool, EditFileTool,
          FindFilesTool, FileSearchTool, RunPythonTool,
          TodoRead, TodoWrite]
loop:
  max_iterations: 150        # agent.run() round-trip cap (consumed by the runner)
  max_format_retries: 2      # resume the session on a MODEL_FORMAT_CRASH (bad tool-call JSON)
  continue_nudges: 0         # presence-gated resumes when the model stops early (0 = strict autonomy)
