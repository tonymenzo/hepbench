# Curated class metadata for the HEPBench results site (read by
# scripts/build_site.py). Optional: title + a short, hand-written description.
title: Forward LLP reach
description: >-
  Muon-philic scalar LLP sensitivity study: from a pinned model card the
  agent derives the phi decay widths, GENERATES the forward meson flux with
  Pythia, decays it to phi across every open production channel
  (pseudoscalar + vector) and both visible searches (mu mu tree + gamma
  gamma one-loop), propagates through a decay-in-flight decay volume, and
  reports the expected signal yield N_sig at a declared (search, m_phi, g)
  point set. Graded on a symbolic/value width check and a log-space
  coarse->fine tolerance ladder on the yields.
