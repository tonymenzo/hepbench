[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hepbench"
version = "1.0.0"
description = "High-energy-physics benchmarks for LLM agents, built on toolbench."
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.12"
authors = [
    { name = "Tony Menzo", email = "amenzo@ua.edu" },
]
keywords = [
    "high-energy-physics",
    "llm-agents",
    "benchmark",
    "evaluation",
    "toolbench",
    "toolbase",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]

# HEPBench is benchmark content. The runner, metrics, and CLI come from
# toolbench; the tools_* loadouts serve HEPTAPOD through toolbase. Everything
# else (numpy, matplotlib, orchestral, ...) arrives transitively.
dependencies = [
    "toolbench[toolbase]>=0.11.0",
    # benchmarks/symbolic grades formula answers by numeric sampling of
    # sympy-parsed expressions (benchmarks/symbolic/_shared/checks.py),
    # so sympy is a grading-time dependency, not a tool dependency.
    "sympy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.urls]
Repository = "https://github.com/tonymenzo/hepbench"
Issues = "https://github.com/tonymenzo/hepbench/issues"

# No package code ships: benchmarks/ is data resolved by path via
# `toolbench run --benchmark`.
[tool.setuptools]
packages = []
